<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Niko</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      .carregando-niko { position: fixed; inset: 0; display: grid; place-items: center; background: #0e0e10; }
      .carregando-niko img { width: 76px; height: 76px; animation: respirar-niko 1.6s ease-in-out infinite; }
      @keyframes respirar-niko { 0%, 100% { transform: scale(0.94); opacity: 0.75; } 50% { transform: scale(1); opacity: 1; } }
      html.janela-sobreposta .carregando-niko { display: none; }
    </style>
  </head>
  <body>
    <div id="raiz"><div class="carregando-niko" aria-busy="true"><img src="/favicon.svg" alt="Niko" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
